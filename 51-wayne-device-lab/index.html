<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Wayne Device Lab</title>
<style>
* { font-family: sans-serif; font-size: 28px; }
body { background: #f5f5f5; color: #111111; margin: 0; }
.topo { text-align: center; padding: 10px; }
.grade { display: flex; }
.menu { width: 220px; background: #ffffff; padding: 10px; }
.painel { flex: 1; padding: 10px; }
.cartao { background: #ffffff; border: 1px solid #cccccc; padding: 10px; margin: 5px; text-align: center; min-height: 80px; display: flex; align-items: center; justify-content: center; }
button { font-family: sans-serif; font-size: 28px; }
</style>
</head>
<body>
<div class="topo">WAYNE DEVICE LAB</div>
<div class="grade">
<div class="menu">
<div>Clientes</div>
<div>Tela</div>
<div>Alertas</div>
<div>Chamadas</div>
<div>Bloquear</div>
<div>Injecao</div>
<div>Console</div>
<div>Atividade</div>
<div>Configuracoes</div>
</div>
<div class="painel">
<div>Posso conectar?</div>
<div>Vou mostrar só nome, bateria e ping.</div>
<div class="cartao">📱 POCO F5</div>
<div class="cartao">📱 Galaxy A51</div>
<div class="cartao">📱 Moto g84</div>
<div class="cartao">📱 A25 de lab</div>
<div>Aparelho: <span id="nome">---</span></div>
<div>Bateria: <span id="bateria">---</span></div>
<div>Ping: <span id="ping">---</span></div>
<button onclick="permitir()">Permitir</button>
<button onclick="desconectar()">Desconectar</button>
<button onclick="foto()">Foto</button>
<button onclick="live()">1 Live</button>
<button onclick="proteger()">Proteger</button>
<button onclick="desproteger()">Desproteger</button>
<div id="mascara" style="display:none;background:#2a2a2a;border:9px solid white;width:60%;max-width:760px;margin:38px auto;text-align:center;color:white;padding:4509px;border-radius:28px;font-weight:bold;letter-spacing:4px;box-shadow:0 18px 44px rgba(0,0,0,0.55);">🛡️ Protegido - Protecao ativa</div>
</div>
</div>
<script>
function permitir(){document.getElementById("nome").textContent="Aparelho do lab";}
function desconectar(){document.getElementById("nome").textContent="---";}
function proteger(){document.getElementById("mascara").style.display="block";}
function desproteger(){document.getElementById("mascara").style.display="none";}
function foto(){alert("Foto clicada");}
function live(){alert("1 Live clicada");}
</script>
</body>
</html>
